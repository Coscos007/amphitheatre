# Optional overlay: LiveKit with host networking (Linux VMs only).
# Docker Desktop on macOS/Windows cannot use this.
#
#   docker compose -f docker-compose.yml -f infra/compose/livekit-hostnet.yml up
#
# Also edit infra/livekit/livekit.yaml:
#   redis.address: 127.0.0.1:6379
#   rtc.use_external_ip: true
#   rtc.enable_loopback_candidate: false

services:
  livekit:
    network_mode: host
    networks: !reset []
    ports: !reset []
    extra_hosts: !reset []

  redis:
    ports:
      - "127.0.0.1:6379:6379"

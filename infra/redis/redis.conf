# Valkey (RESP-compatible Redis fork) for Amphitheatre.
# DB 0  → reserved if the Hono API ever needs pub/sub
# DB 1  → LiveKit (set in infra/livekit/livekit.yaml)
#
# Do NOT use allkeys-lru: LiveKit stores routing state here and eviction
# would drop live rooms. Fail writes instead of silently deleting keys.

bind 0.0.0.0
port 6379
# Other compose services (LiveKit) are not loopback. protected-mode yes + no
# requirepass would close those connections (broken pipe / DENIED).
# Valkey is on the private coliseum network; do not publish 6379 on a public NIC.
protected-mode no

# Enough for local/dev rooms; raise on the dedicated host.
maxmemory 256mb
maxmemory-policy noeviction

# Light persistence so a compose restart does not wipe LiveKit routing mid-session.
# Rooms are still ephemeral at the application layer (TTL / empty-room delete).
save 60 1
appendonly no

# Pub/sub buffers if the API ever uses it.
client-output-buffer-limit pubsub 32mb 8mb 60

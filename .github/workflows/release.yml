name: Release

# Manual release flow: someone bumps the version + moves CHANGELOG.md's
# "Unreleased" section into a dated one, then runs
#   git tag vX.Y.Z && git push --tags
# This workflow takes it from there: creates the GitHub Release (notes taken
# from CHANGELOG.md, in English) and publishes a multi-arch Docker image.
#
# Requires two repository secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
# (Settings -> Secrets and variables -> Actions).

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  IMAGE_NAME: simstosh/amphitheatre

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section
        id: changelog
        run: |
          {
            echo "notes<<CHANGELOG_EOF"
            ./scripts/extract-changelog.sh "${{ steps.version.outputs.version }}"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: ${{ steps.changelog.outputs.notes }}
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}

      - name: Set up QEMU (for arm64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute Docker tags
        id: tags
        run: |
          version="${{ steps.version.outputs.version }}"
          tags="${IMAGE_NAME}:${version}"
          # Also tag ":X.Y" and ":latest" for stable releases (not pre-releases like "1.2.0-beta.1").
          if [[ "$version" != *-* ]]; then
            minor="${version%.*}"
            tags="${tags},${IMAGE_NAME}:${minor},${IMAGE_NAME}:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}

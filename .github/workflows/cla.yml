name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >-
          (github.event.comment.body == 'recheck' ||
           github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
          github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          branch: main
          allowlist: bot*,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: >
            Thank you for contributing to Amphitheatre (SIMSDEV).

            This repository is licensed under AGPL-3.0-only. Pull Requests are accepted only after every author signs the Individual Contributor License Agreement (ICLA). The ICLA lets SIMSDEV relicense contributions (including for a future paid hosted offering) while the public tree stays AGPL-3.0-only.

            1. Read the ICLA: $pathToCLADocument
            2. Reply to this comment with **exactly**:

            I have read the CLA Document and I hereby sign the CLA

            Comments such as "recheck" ask the bot to reprocess signatures.
          custom-allsigned-prcomment: All contributors have signed the Amphitheatre ICLA.
          signed-commit-message: $contributorName has signed the Amphitheatre ICLA in $owner/$repo#$pullRequestNo
          create-file-commit-message: Create CLA signature file (ICLA v1)
          lock-pullrequest-aftermerge: true

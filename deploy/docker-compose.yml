# Amphitheatre — ready to run, no repo clone needed.
#
# This file only needs its two neighbours (livekit.yaml and .env, which you
# create from env.example) — you can copy just the "deploy" folder to your
# server. It downloads pre-built images; nothing is compiled on your machine.
#
# Quick start:
#   cp env.example .env   # then edit .env with your domains and secrets
#   docker compose up -d              # app + LiveKit, no broadcast stage
#   docker compose --profile ome up -d  # also start the optional broadcast stage
#
# This file publishes ports directly on the host (good for a quick test by
# IP, or if you put Caddy in front with the "caddy" profile below). If you
# already run Traefik (or another reverse proxy) on this machine, use
# docker-compose.traefik.yml instead — see docs/self-hosting.md.

name: amphitheatre

networks:
  amphitheatre:
    name: amphitheatre
    driver: bridge

services:
  app:
    image: simstosh/amphitheatre:latest
    container_name: amphitheatre-app
    restart: unless-stopped
    depends_on:
      livekit:
        condition: service_started
    environment:
      SESSION_SECRET: ${SESSION_SECRET}
      PUBLIC_APP_HOSTNAME: ${PUBLIC_APP_HOSTNAME}
      PUBLIC_LIVEKIT_HOSTNAME: ${PUBLIC_LIVEKIT_HOSTNAME}
      PUBLIC_OME_HOSTNAME: ${PUBLIC_OME_HOSTNAME}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_HTTP_URL: http://livekit:7880
      OME_API_URL: http://ome:8081
      OME_API_ACCESS_TOKEN: ${OME_API_ACCESS_TOKEN}
      TRUST_PROXY: "true"
      COOKIE_SECURE: "true"
      DATABASE_PATH: /app/data/amphitheatre.sqlite
    volumes:
      - app-data:/app/data
    ports:
      - "3001:3001"
    networks: [amphitheatre]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    # Traefik (see docker-compose.traefik.yml for the full setup):
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.amphitheatre.rule=Host(`${PUBLIC_APP_HOSTNAME}`)
    #   - traefik.http.routers.amphitheatre.tls.certresolver=letsencrypt
    #   - traefik.http.services.amphitheatre.loadbalancer.server.port=3001

  redis:
    # Valkey is RESP-compatible. LiveKit still connects as "redis:6379".
    image: valkey/valkey:9.1.1-alpine
    container_name: amphitheatre-valkey
    restart: unless-stopped
    command: ["valkey-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction", "--save", "60", "1"]
    volumes:
      - valkey-data:/data
    networks: [amphitheatre]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  livekit:
    image: livekit/livekit-server:v1.13.5
    container_name: amphitheatre-livekit
    restart: unless-stopped
    init: true
    depends_on:
      redis:
        condition: service_healthy
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"      # signalling HTTP + WebSocket
      - "7881:7881"      # ICE/TCP fallback
      - "7882:7882/udp"  # WebRTC media (UDP mux)
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    networks: [amphitheatre]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7880/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Optional broadcast stage (OBS -> everyone watches the same live stream).
  # Start with: docker compose --profile ome up -d
  ome:
    image: ovenmedialabs/ovenmediaengine:v0.21.0
    container_name: amphitheatre-ome
    profiles: ["ome"]
    restart: unless-stopped
    init: true
    environment:
      OME_HOST_IP: ${PUBLIC_OME_HOSTNAME}
      OME_RTMP_PROV_PORT: "1935"
      OME_ORIGIN_PORT: "9000"
      OME_LLHLS_STREAM_PORT: "3333"
      OME_LLHLS_STREAM_TLS_PORT: "3334"
      OME_WEBRTC_SIGNALLING_PORT: "3333"
      OME_WEBRTC_SIGNALLING_TLS_PORT: "3334"
      OME_WEBRTC_TCP_RELAY_PORT: "3478"
      OME_WEBRTC_CANDIDATE_PORT: "10000-10003/udp"
      OME_WEBRTC_TCP_ICE_PORT: "10000/tcp"
    volumes:
      - ./ome/origin_conf:/opt/ovenmediaengine/bin/origin_conf:ro
    ports:
      - "1935:1935"                    # RTMP ingest (OBS)
      - "3333:3333"                    # WebRTC signalling + LL-HLS (HTTP)
      - "3334:3334"                    # TLS signalling / LL-HLS
      - "3478:3478"                    # TURN / TCP relay
      - "10000-10003:10000-10003/udp"  # WebRTC ICE (UDP)
      - "10000:10000/tcp"              # WebRTC ICE (TCP)
      - "8081:8081"                    # REST API (internal use only — do not expose publicly)
    networks: [amphitheatre]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8081'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # Optional TLS reverse proxy (automatic Let's Encrypt certificates).
  # Start with: docker compose --profile caddy up -d
  caddy:
    image: caddy:2.11.4-alpine
    container_name: amphitheatre-caddy
    profiles: ["caddy"]
    restart: unless-stopped
    environment:
      PUBLIC_APP_HOSTNAME: ${PUBLIC_APP_HOSTNAME}
      PUBLIC_LIVEKIT_HOSTNAME: ${PUBLIC_LIVEKIT_HOSTNAME}
      PUBLIC_OME_HOSTNAME: ${PUBLIC_OME_HOSTNAME}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./reverse-proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [amphitheatre]
    depends_on:
      app:
        condition: service_healthy
      livekit:
        condition: service_healthy

volumes:
  app-data:
    name: amphitheatre-app-data
  valkey-data:
    name: amphitheatre-valkey-data
  caddy-data:
  caddy-config:
